<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="client.js"></script>
    <title>Lakáshirdetések</title>
</head>
<body>
    <header>
        Lakáshirdetések
        <div id="options-container">
            <div id="image-uploader-button">
                <a href="./index-pictures.html">Kép feltöltése</a>
            </div>
            <div id="advertisement-uploader-button">
                <a href="./index.html">Lakáshirdetés feltöltése</a>
            </div>
        </div>
    </header>
    <form id="advertisement-search-form" method="get">
        <div id="search-attribute-container">
            <div class="advertisement-search-attribute">
            <label class="label-form" for="city-name">Város neve: </label>
            <input class="my-input" type="text" name="city-name">
            </div>
            <div class="advertisement-search-attribute">
            <label class="label-form" for="city-quarter-name">Negyede: </label>
            <input class="my-input" type="text" name="city-quarter-name">
            </div>
            <div class="advertisement-search-attribute">
            <label class="label-form" for="min-price">Minimum ár: </label>
            <input class="my-input" type="text" name="min-price">
            </div>
            <div class="advertisement-search-attribute">
            <label class="label-form" for="max-price">Maximum ár: </label>
            <input class="my-input" type="text" name="max-price">
            </div>
            <button id="search-button" type="submit">Keresés</button>
        </div>
    </form>
    <div id="panel-container">
        <div id="menu-panel">
            <form action="/submit_advertisement_upload" id="advertisement-uploader-form" method="post">
                <p class="p-form">Város:</p>
                <input class="my-input" type="text" name="city" value="Kolozsvar"><br>
                <p class="p-form">Városnegyed:</p>
                <input class="my-input" type="text" name="city_quarter" value="Pataret"><br>
                <p class="p-form">Felszinterület:</p>
                <input class="my-input" type="text" name="surface_area" value="1"><br>
                <p class="p-form">Ár:</p>
                <input class="my-input" type="text" name="price" value="2"><br>
                <p class="p-form">Szobák száma:</p>
                <input class="my-input" type="text" name="number_of_rooms" value="3"><br><br>
                <label class="label-form" for="upload_date">Feltöltés dátuma:</label>
                <input class="my-input" type="date" name="upload_date"><br><br>
                <button class="my-submit" type="submit">Lakáshirdetés feltöltése</button>
            </form>
        </div>
        <div id="advertisement-panel">
            Itt lesznek a lakáshirdetések
        </div>
    </div>
</body>
</html>
