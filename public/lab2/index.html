<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Aritmetikai kérdés - válasz</title>
</head>
<body>
    <header>
        Aritmetikai kérdés - válasz
    </header>
    <form name="my-form">
        <label for="fullname">Név:&ensp;</label>
        <input type="text" id="fullname" name="fullname"><br><br>
        <label>Válassz ki legalább egyet az alábbi műveletek közül:</label><br>
        <input type="checkbox" id="addition" name="addition" value="+">
        <label for="addition">+</label><br>
        <input type="checkbox" id="subtraction" name="subtraction" value="-">
        <label for="subtraction">-</label><br>
        <input type="checkbox" id="multiplication" name="multiplication" value="*">
        <label for="multiplication">*</label><br>
        <input type="checkbox" id="division" name="division" value="/">
        <label for="division">/</label><br>
        <p>Feladatok száma:&ensp;
            <select id="number-of-exercises">
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            </select>
        </p>
        <button type="submit" id="submit-button">Vágjunk bele!</button>
    </form>
</body>
</html>
