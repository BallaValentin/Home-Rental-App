<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="client.js"></script>
    <script src="server.js"></script>
    <title>Lakáshirdetések</title>
</head>
<body>
    <header>
        Lakáshirdetések
        <div id="options-container">
            <div id="image-uploader-button">
                <a href="./index-pictures.html">Kép feltöltése</a>
            </div>
            <div id="advertisement-uploader-button">
                <a href="./index.html">Lakáshirdetés feltöltése</a>
            </div>
        </div>
    </header>
    <div id="panel-container">
        <div id="menu-panel">
            <form id="image-uploader-form">
                <p class="p-form">LakáshirdetésID:</p>
                <input class="my-input" type="text" name="advertisement-id-input"><br><br>
                <label class="label-form" for="image-uploader-input">Kép megadása:</label>
                <input class="my-input" type="file" name="image-uploader-input" accept="image/png, image/jpeg"><br><br>
                <button class="my-submit" type="submit">Kép feltöltése</button>
            </form>
        </div>
        <div id="advertisement-panel">
            Itt lesznek a lakáshirdetések
        </div>
    </div>
</body>
</html>
